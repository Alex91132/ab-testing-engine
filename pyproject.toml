[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abengine"
version = "0.1.0"
description = "Движок анализа A/B-экспериментов: SQL-метрики, CUPED, дельта-метод, последовательные тесты, HTML-отчёт"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "scipy", "duckdb", "matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
